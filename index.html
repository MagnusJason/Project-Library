<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Library</h1>
            <button id="newBookBtn" class="btn btn-primary">New Book</button>
        </header>

        <div id="libraryDisplay" class="library-grid">
            <!-- Books will be displayed here -->
        </div>
    </div>

    <dialog id="bookDialog">
        <form id="bookForm">
            <h2>Add New Book</h2>
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>
            <div class="form-group">
                <label for="pages">Number of Pages:</label>
                <input type="number" id="pages" name="pages" min="1" required>
            </div>
            <div class="form-group">
                <label for="read">Read Status:</label>
                <select id="read" name="read">
                    <option value="false">Not Read</option>
                    <option value="true">Read</option>
                </select>
            </div>
            <div class="form-group">
                <label for="genre">Genre:</label>
                <input type="text" id="genre" name="genre" placeholder="Optional">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Book</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
